# Golden command set (ACE_MASTER_PLAN.md §16.2). It grows every stage.
#
# Each case: an utterance (English or Hinglish) and what the router must make of it:
#   skill + params   a one-step task for that skill
#   control          "stop", "yes" or "no"
#   no_match: true   the fast path does not understand it (S14-S16 add models for these)
# Every value is quoted: YAML would read a bare yes / no / on as true / false.

# ---- echo (S07 test skill) ----
- utterance: "echo hello"
  skill: "system.echo"
  params: {text: "hello"}
- utterance: "Echo Hello World"
  skill: "system.echo"
  params: {text: "Hello World"}
- utterance: "please echo testing 1 2 3"
  skill: "system.echo"
  params: {text: "testing 1 2 3"}
- utterance: "hey ace, echo hi there"
  skill: "system.echo"
  params: {text: "hi there"}

