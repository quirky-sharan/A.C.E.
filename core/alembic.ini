# Alembic CLI settings for ACE developers only. The app itself configures Alembic in code
# (ace_core.db.migrate) and migrates its own database on start.
#
# New migration (after changing ace_core/db/models.py), from core/:
#   uv run alembic upgrade head
#   uv run alembic revision --autogenerate --rev-id 0002 -m "short description"
# Then review the generated file in src/ace_core/db/migrations/versions/ by hand.

[alembic]
script_location = %(here)s/src/ace_core/db/migrations
prepend_sys_path = .
# Throwaway development database (gitignored) - never Sharan's real ACE data.
sqlalchemy.url = sqlite:///%(here)s/.dev-db/ace-dev.db
