[project]
name = "ace-core"
version = "0.0.1"
description = "ACE core service: voice, brain, verification council and PC-control skills (see ACE_MASTER_PLAN.md)."
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pywin32>=312",
    "sqlalchemy>=2.1.8",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
    "websockets>=17.4",
]

[project.scripts]
ace-core = "ace_core:main"
ace-cli = "ace_core.ipc.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.4",
    "types-pywin32>=312.0.0.20261104",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade, S bandit (incl. S608 string-built SQL),
# N naming, SIM simplify, RUF ruff-specific.
select = ["E", "W", "F", "I", "B", "UP", "S", "N", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# assert is expected in tests; tests start the core as a subprocess with fixed, trusted arguments.
"tests/**" = ["S101", "S603"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
markers = [
    "hardware: needs real devices (mic, speakers, GPU); local only, never in CI",
    "windows_ui: drives real Windows apps through UI Automation; local only, never in CI",
]

[tool.coverage.run]
source = ["ace_core"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80 # NFR-9: >= 80 % for non-hardware core logic
